openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DurianFarm AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: plots
    description: Orchard plot management
  - name: transactions
    description: Farm accounting transactions
  - name: fertilizer
    description: Fertilizer and pesticide calculations
  - name: dashboard
    description: Dashboard summaries and forecasting
  - name: tasks
    description: Farm task management
  - name: workers
    description: Worker and attendance management
  - name: inventory
    description: Inventory and stock management
  - name: equipment
    description: Equipment and maintenance tracking
  - name: notifications
    description: Notification center
  - name: settings
    description: Organization settings
  - name: search
    description: Global search across farm data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /plots:
    get:
      operationId: listPlots
      tags: [plots]
      summary: List all orchard plots
      responses:
        "200":
          description: List of plots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plot"
    post:
      operationId: createPlot
      tags: [plots]
      summary: Create a new orchard plot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"

  /plots/{id}:
    get:
      operationId: getPlot
      tags: [plots]
      summary: Get a plot by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"
        "404":
          description: Not found
    patch:
      operationId: updatePlot
      tags: [plots]
      summary: Update a plot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlotUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"
    delete:
      operationId: deletePlot
      tags: [plots]
      summary: Delete a plot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List farm transactions
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: period
          in: query
          schema:
            type: string
            enum: [monthly, seasonal, yearly]
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /fertilizer/calculate:
    post:
      operationId: calculateFertilizer
      tags: [fertilizer]
      summary: Calculate fertilizer and pesticide amounts for a plot and stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FertilizerInput"
      responses:
        "200":
          description: Calculated fertilizer plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FertilizerPlan"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall farm dashboard summary
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/forecast:
    get:
      operationId: getForecast
      tags: [dashboard]
      summary: Get AI-powered season forecast and recommendations
      responses:
        "200":
          description: Season forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResult"

  /dashboard/monthly-trend:
    get:
      operationId: getMonthlyTrend
      tags: [dashboard]
      summary: Get monthly income/expense trend for charts
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyTrend"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, done]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get task counts by status
      responses:
        "200":
          description: Task summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List workers
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/{id}:
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete a worker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /attendance:
    get:
      operationId: listAttendance
      tags: [workers]
      summary: List attendance records
      parameters:
        - name: workerId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
            description: "YYYY-MM"
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [workers]
      summary: Record attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/{id}:
    delete:
      operationId: deleteAttendance
      tags: [workers]
      summary: Delete an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/summary:
    get:
      operationId: getInventorySummary
      tags: [inventory]
      summary: Get inventory value and low-stock summary
      responses:
        "200":
          description: Inventory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySummary"

  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List equipment
      responses:
        "200":
          description: List of equipment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Create an equipment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update an equipment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete an equipment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications (auto-generates from live farm conditions)
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Marked all as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /settings/org:
    get:
      operationId: getOrgSettings
      tags: [settings]
      summary: Get organization settings (creates defaults if missing)
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
    patch:
      operationId: updateOrgSettings
      tags: [settings]
      summary: Update organization settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search across plots, transactions, tasks, workers, inventory, and equipment
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results grouped by entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Plot:
      type: object
      required: [id, name, areRai, treeCount, variety, treeAge, plantedDate, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        areRai:
          type: number
          description: Area in rai
        treeCount:
          type: integer
        variety:
          type: string
          description: "หมอนทอง | ชะนี | กระดุม | พวงมณี | ก้านยาว"
        treeAge:
          type: integer
          description: Tree age in years
        plantedDate:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        status:
          type: string
          description: "Auto-calculated status based on tree age"
        density:
          type: number
          description: Trees per rai
        createdAt:
          type: string
          format: date-time

    PlotInput:
      type: object
      required: [name, areRai, treeCount, variety, treeAge, plantedDate]
      properties:
        name:
          type: string
        areRai:
          type: number
        treeCount:
          type: integer
        variety:
          type: string
        treeAge:
          type: integer
        plantedDate:
          type: string
          format: date
        notes:
          type: string

    PlotUpdate:
      type: object
      properties:
        name:
          type: string
        areRai:
          type: number
        treeCount:
          type: integer
        variety:
          type: string
        treeAge:
          type: integer
        plantedDate:
          type: string
          format: date
        notes:
          type: string

    Transaction:
      type: object
      required: [id, date, type, category, amount, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
          description: Amount in THB
        notes:
          type: ["string", "null"]
        plotId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [date, type, category, amount]
      properties:
        date:
          type: string
          format: date
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
        notes:
          type: string
        plotId:
          type: integer

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
        notes:
          type: string
        plotId:
          type: integer

    FertilizerInput:
      type: object
      required: [areRai, treeCount, stage]
      properties:
        areRai:
          type: number
        treeCount:
          type: integer
        stage:
          type: integer
          description: "1=เตรียมออกดอก, 2=ออกดอก, 3=ติดผล, 4=ก่อนเก็บเกี่ยว"
        variety:
          type: string

    FertilizerItem:
      type: object
      required: [name, unit, quantityPerRai, totalQuantity, estimatedCostPerUnit, totalCost]
      properties:
        name:
          type: string
        unit:
          type: string
        quantityPerRai:
          type: number
        totalQuantity:
          type: number
        estimatedCostPerUnit:
          type: number
        totalCost:
          type: number

    FertilizerPlan:
      type: object
      required: [stage, stageName, fertilizers, pesticides, totalFertilizerCost, totalPesticideCost, totalCost, costPerRai, costPerTree]
      properties:
        stage:
          type: integer
        stageName:
          type: string
        fertilizers:
          type: array
          items:
            $ref: "#/components/schemas/FertilizerItem"
        pesticides:
          type: array
          items:
            $ref: "#/components/schemas/FertilizerItem"
        totalFertilizerCost:
          type: number
        totalPesticideCost:
          type: number
        totalCost:
          type: number
        costPerRai:
          type: number
        costPerTree:
          type: number

    DashboardSummary:
      type: object
      required: [totalIncome, totalExpense, netProfit, roi, totalPlots, totalTrees, totalAreaRai, costPerRai, revenuePerTree]
      properties:
        totalIncome:
          type: number
        totalExpense:
          type: number
        netProfit:
          type: number
        roi:
          type: number
          description: ROI in percentage
        totalPlots:
          type: integer
        totalTrees:
          type: integer
        totalAreaRai:
          type: number
        costPerRai:
          type: number
        revenuePerTree:
          type: number
        expenseByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
        incomeByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"

    CategorySummary:
      type: object
      required: [category, total]
      properties:
        category:
          type: string
        total:
          type: number

    MonthlyTrend:
      type: object
      required: [month, year, income, expense, netProfit]
      properties:
        month:
          type: integer
        year:
          type: integer
        income:
          type: number
        expense:
          type: number
        netProfit:
          type: number

    ForecastResult:
      type: object
      required: [forecastedIncome, forecastedExpense, forecastedNetProfit, yoyChange, recommendations, inputCostInflation]
      properties:
        forecastedIncome:
          type: number
        forecastedExpense:
          type: number
        forecastedNetProfit:
          type: number
        yoyChange:
          type: number
          description: Year-over-year change percentage
        inputCostInflation:
          type: number
          description: Estimated input cost inflation percentage
        recommendations:
          type: array
          items:
            type: string
        currentSeasonStage:
          type: string

    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        category:
          type: ["string", "null"]
        plotId:
          type: ["integer", "null"]
        workerId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        category:
          type: string
        plotId:
          type: integer
        workerId:
          type: integer
        dueDate:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        category:
          type: string
        plotId:
          type: integer
        workerId:
          type: integer
        dueDate:
          type: string
          format: date

    TaskSummary:
      type: object
      required: [todo, inProgress, done, overdue]
      properties:
        todo:
          type: integer
        inProgress:
          type: integer
        done:
          type: integer
        overdue:
          type: integer

    Worker:
      type: object
      required: [id, name, role, status, hireDate, dailyWage, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        phone:
          type: ["string", "null"]
